/* Viewport-sized stage. Smaller windows scale the whole view, never crop controls. */
html,body{width:100%;height:100%;overflow:hidden}
body{font-size:17px}
#stage{position:absolute;left:50%;top:50%;width:calc(100% - 16px);max-width:1500px;transform-origin:center;transform:translate(-50%,-50%)}
header{padding:9px 24px;background:transparent;border:0}header small{font-size:10px}header strong{font-size:16px}

h1{font-size:30px;margin:0 0 6px}h2{font-size:21px;margin:0 0 14px}
p{line-height:1.4;margin:10px 0}.eyebrow{margin-bottom:6px}.panel{padding:20px;margin:12px 0;border-radius:16px}
.grid{gap:12px 16px}label{margin-bottom:5px;font-size:14px}input,select{padding:9px;font-size:16px}

.answers{grid-template-columns:repeat(2,1fr);max-width:360px;margin:8px auto;gap:12px}.answer svg{height:74px}.answer{padding:10px}.response-panel .actions{justify-content:center}
.participant-actions{justify-content:center}.progress{margin:10px 0}.clock{margin:22px;font-size:64px}
